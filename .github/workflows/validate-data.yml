name: Validate data

# Enforces that data/canonical.json is consistent and that the generated
# data.json files match what scripts/build_canonical.py produces.
# No secrets, no deploy change — this workflow only validates.

on:
  push:
    branches: [main, phase2-option-b]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical dataset
        run: python scripts/validate_canonical.py
